limit_req_zone $binary_remote_addr zone=api_login:1m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_register:1m rate=1r/m;
limit_req_zone $binary_remote_addr zone=api_ping:1m rate=60r/m;

server {
    listen 80;
    root /var/www/html/public;
    limit_req_status 429;
    limit_req_log_level warn;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /api/login_check {
        limit_req zone=api_login burst=2 nodelay;
        try_files $uri /index.php$is_args$args;
    }

    location = /api/register {
        limit_req zone=api_register burst=1 nodelay;
        try_files $uri /index.php$is_args$args;
    }

    location = /api/ping {
        limit_req zone=api_ping burst=10 nodelay;
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}